name: exposed-services

networks:
  proxy:
    external: true
    name: proxy
  arrs_default:
    external: true
    name: arrs_default

services:

  #########################
  # ACTUAL - Budgeting App
  #########################
  actual:
    image: actualbudget/actual-server:latest
    container_name: actual
    networks: [proxy]
    ports:
      - "${ACTUAL_PORT}:${ACTUAL_PORT}"
    restart: unless-stopped
    volumes:
      - ./actual-data:/data   # persists everything (server + user files)
    environment:
      - ACTUAL_PORT=${ACTUAL_PORT}

  #########################
  # AUDIOBOOKSHELF - Audiobooks & Podcasts
  #########################
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    networks: [proxy]
    ports:
      - "${ABS_PORT}:${EXTERNAL_WEB_PORT}"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "M:/media/audiobooks:/audiobooks"
      - "M:/media/podcasts:/podcasts"
      - "./audiobookshelf/config:/config"
      - "./audiobookshelf/metadata:/metadata"
    restart: unless-stopped

  #########################
  # FAIRSHARE - CS Calculator (API + Web, browser calls the API directly)
  #########################
  fairshare-api:
    build:
      # Clone JJWren/FairShare and point the context at it (or swap for a
      # registry image if you publish one).
      context: ../FairShare
      dockerfile: src/FairShare.Api/Dockerfile
    container_name: fairshare-api
    networks: [proxy]
    ports:
      - "${FAIRSHARE_API_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # /data (not /app/data): the API image pre-creates /data owned by its non-root
      # user; any other mountpoint comes up root-owned and unwritable.
      ConnectionStrings__Default: "Data Source=/data/fairshare.db"
      Jwt__SigningKey: "${FAIRSHARE_JWT_SIGNING_KEY:?Set FAIRSHARE_JWT_SIGNING_KEY in .env}"
      AdminSeed__Enabled: "${ADMIN_SEED_ENABLED:-true}"
      AdminSeed__User: "${AdminSeed__User}"
      AdminSeed__Password: "${AdminSeed__Password}"
      AdminSeed__LogGeneratedPassword: "${ADMIN_SEED_LOG_GENERATED_PASSWORD:-true}"
      Auth__AllowSelfRegistration: "${ALLOW_SELF_REGISTRATION:-false}"
      Cors__AllowedOrigins__0: "${FAIRSHARE_WEB_ORIGIN}"
    volumes:
      # Named volume, NOT a bind mount: if this compose lives on a mapped network
      # drive, SQLite cannot hold write locks over SMB ("attempt to write a
      # readonly database" / segfaults). The db lives in Docker's VM disk instead.
      - "fairshare-data:/data"
    healthcheck:
      # The default Debian-based mcr.microsoft.com/dotnet/aspnet image ships no
      # curl/wget, but it does have bash — so bash + /dev/tcp does the HTTP GET.
      # NOTE: Alpine/distroless .NET images have no bash either; there, install
      # curl/wget in the Dockerfile and swap this test accordingly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  fairshare-web:
    build:
      context: ../FairShare
      dockerfile: src/FairShare.Web/Dockerfile
    container_name: fairshare-web
    networks: [proxy]
    ports:
      - "${FAIRSHARE_PORT}:80"
    environment:
      # Browser-visible API URL (the browser makes the calls, not this container).
      API_BASE_URL: "${FAIRSHARE_API_BASE_URL}"
    depends_on:
      fairshare-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  #########################
  # KAVITA - eBook reader
  #########################
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    networks: [proxy]
    ports:
      - "${KAVITA_PORT}:${KAVITA_PORT}"
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "./kavita/config:/kavita/config"
      - "M:/media/books_curated/cbz:/media/books_curated/cbz"
      - "M:/media/books_curated/epub:/media/books_curated/epub"

  #########################
  # KOMGA - eComic reader
  #########################
  komga:
    image: gotson/komga:latest
    container_name: komga
    networks: [proxy]
    ports:
      - "${KOMGA_PORT}:${KOMGA_PORT}"
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JAVA_TOOL_OPTIONS=-Xmx4g
    volumes:
      - "./komga/config:/config"
      - "M:/media/books_curated/cbz:/media/books_curated/cbz:ro"

  #########################
  # KOMF - Komga/Kavita metadata fetcher
  #########################
  komf:
    image: sndxr/komf:latest
    container_name: komf
    networks: [proxy]
    ports:
      # Komf listens on 8085 inside the container; only the host side is configurable.
      - "${KOMF_PORT}:8085"
    environment:
      # Point Komf at Komga/Kavita (service names resolve on the shared network).
      # Keep the credentials in .env — never hardcode them here.
      - KOMF_KOMGA_BASE_URI=http://komga:25600
      - KOMF_KOMGA_USER=${KOMF_KOMGA_USER}
      - KOMF_KOMGA_PASSWORD=${KOMF_KOMGA_PASSWORD}
      - KOMF_KAVITA_BASE_URI=http://kavita:8080
      - KOMF_KAVITA_API_KEY=${KOMF_KAVITA_API_KEY}
      - KOMF_LOG_LEVEL=INFO
    volumes:
      - "./komf/config:/config" # holds application.yml + Komf DB
    restart: unless-stopped

  #########################
  # MEALIE - Recipe manager & meal planner
  #########################
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: always
    networks: [proxy]
    ports:
      - "${MEALIE_PORT}:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - mealie-data:/app/data/
    environment:
      - ALLOW_SIGNUP=false
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - BASE_URL=https://mealie.${DOMAIN_NAME}

  #########################
  # SEERR - Media requests (community fork of Overseerr)
  #########################
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    networks:
      - proxy
      - arrs_default
    ports:
      # Seerr listens on 5055 inside the container; only the host side is configurable.
      - "${SEERR_PORT}:5055"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "./seerr/config:/app/config"
    restart: unless-stopped

  #########################
  # TAUTULLI - Plex analytics
  #########################
  tautulli:
    image: ghcr.io/tautulli/tautulli
    container_name: tautulli
    restart: unless-stopped
    volumes:
      - "./tautulli/config:/config"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks: [proxy]
    ports:
      - "${TAUTULLI_PORT}:${TAUTULLI_PORT}"
    
  #########################
  # WIZARR (media user invitation tool)
  #########################
  wizarr:
    container_name: wizarr
    restart: unless-stopped
    networks: [proxy]
    ports:
      - "${WIZARR_PORT}:${WIZARR_PORT}"
    image: ghcr.io/wizarrrr/wizarr
    volumes:
      - ./wizarr/data:/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DISABLE_BUILTIN_AUTH=false #Set to true ONLY if you are using another auth provider (Authelia, Authentik, etc)

volumes:
  mealie-data:
  fairshare-data:
